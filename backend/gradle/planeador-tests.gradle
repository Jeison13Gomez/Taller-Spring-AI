// Aísla las pruebas del taller de los tests heredados de RAG que aún no compilan.
allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            sourceSets.test.java.setIncludes([
                    'com/example/chat/planeador/**',
                    'com/example/chat/support/ScriptedChatModel.java'
            ])
        }
    }
}
